<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Fibonacci</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Generador de Serie Fibonacci</h1>
        
        <label for="numeroInput">Ingrese un número:</label>
        <input type="number" id="numeroInput" min="1" placeholder="Ej: 8">
        <button id="generarBtn">Generar Serie</button>
        
        <div id="errorMsg" class="error"></div>
        
        <div id="resultado">
            <h2>Resultado:</h2>
            <p id="serieGenerada"></p>
        </div>
    </div>

    <script src="./javascript/java.js"></script>
</body>
</html>
